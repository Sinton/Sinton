<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">我的晚报 · GitHub 特刊</title>
  <desc id="desc">Sinton 的 GitHub Profile 报纸风头版，展示独立开发者、全栈开发者、作品索引、技术栈和个人博客。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8EEDC"/>
      <stop offset="0.52" stop-color="#F3E4C7"/>
      <stop offset="1" stop-color="#EAD6B1"/>
    </linearGradient>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 0H18M0 9H18" stroke="#6E5A43" stroke-opacity="0.07" stroke-width="1"/>
      <path d="M3 0V18M14 0V18" stroke="#6E5A43" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <pattern id="columns" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#8B7658" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#3A2A1D" flood-opacity="0.18"/>
    </filter>
    <style>
      .headline { font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif; }
      .kai { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .ink { fill: #18120D; }
      .soft { fill: #5D4A36; }
      .red { fill: #A33A2D; }
      .micro { font-size: 14px; letter-spacing: 1.8px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="26" fill="#2A2118" opacity="0.16"/>
  <g filter="url(#shadow)">
    <rect x="34" y="30" width="1132" height="560" rx="12" fill="url(#paper)"/>
    <rect x="34" y="30" width="1132" height="560" rx="12" fill="url(#grain)"/>
    <rect x="34" y="30" width="1132" height="560" rx="12" fill="url(#columns)" opacity="0.6"/>
    <rect x="58" y="54" width="1084" height="512" rx="2" stroke="#18120D" stroke-width="3"/>
    <rect x="70" y="66" width="1060" height="488" rx="1" stroke="#18120D" stroke-width="1.2"/>

    <g class="mono micro soft">
      <text x="90" y="99">GITHUB PROFILE / SPECIAL EDITION</text>
      <text x="1110" y="99" text-anchor="end">SINTON · L0101.COM</text>
    </g>
    <path d="M90 116H1110" stroke="#18120D" stroke-width="1.6"/>
    <path d="M90 123H1110" stroke="#18120D" stroke-width="0.8"/>

    <text x="600" y="188" class="headline ink" text-anchor="middle" font-size="76" font-weight="900" letter-spacing="4">我的晚报</text>
    <text x="600" y="226" class="kai red" text-anchor="middle" font-size="28" font-weight="800" letter-spacing="8">GITHUB 特刊</text>

    <path d="M90 252H1110" stroke="#18120D" stroke-width="5"/>
    <path d="M90 264H1110" stroke="#18120D" stroke-width="1.2"/>

    <g>
      <rect x="90" y="292" width="188" height="172" fill="#F5E7CC" stroke="#18120D" stroke-width="1.4"/>
      <text x="114" y="328" class="mono micro red">DEVELOPER CARD</text>
      <text x="114" y="369" class="headline ink" font-size="34" font-weight="900">Sinton</text>
      <text x="114" y="402" class="kai soft" font-size="21" font-weight="700">独立开发者</text>
      <text x="114" y="432" class="kai soft" font-size="21" font-weight="700">全栈开发者</text>
    </g>

    <g>
      <rect x="304" y="292" width="572" height="172" fill="#F9EED8" stroke="#18120D" stroke-width="1.4"/>
      <text x="330" y="329" class="mono micro red">BUILDING PERSONAL SOFTWARE FOR REAL LIFE</text>
      <text x="330" y="360" class="headline ink" font-size="38" font-weight="900">把真实需求做成</text>
      <text x="330" y="400" class="headline ink" font-size="38" font-weight="900">长期维护的小产品</text>
      <text x="330" y="430" class="kai soft" font-size="20" font-weight="700">iOS · Desktop · Web · Backend</text>
      <text x="330" y="454" class="kai soft" font-size="20" font-weight="700">DevOps · AI · Swift · Rust · Java · Python</text>
    </g>

    <g>
      <rect x="902" y="292" width="208" height="172" fill="#F5E7CC" stroke="#18120D" stroke-width="1.4"/>
      <text x="926" y="328" class="mono micro red">BLOG</text>
      <text x="926" y="369" class="headline ink" font-size="28" font-weight="900">博客专栏</text>
      <text x="926" y="405" class="mono soft" font-size="18" font-weight="800">www.l0101.com</text>
      <path d="M926 426H1086" stroke="#A33A2D" stroke-width="1.4"/>
      <text x="926" y="454" class="kai soft" font-size="18" font-weight="700">作品 · 随笔 · 旅行</text>
    </g>

    <path d="M90 492H1110" stroke="#18120D" stroke-width="1.4"/>
    <g class="mono micro ink">
      <text x="92" y="526">作品索引</text>
      <text x="214" y="526" class="soft">MyEcho · MyStudio · MyTravelJournal · MyKitchen · MyDocker</text>
      <text x="92" y="552">技术栈</text>
      <text x="214" y="552" class="soft">iOS · Desktop · Web · Backend · DevOps · AI</text>
    </g>

    <g transform="translate(1014 150) rotate(-8)">
      <rect x="0" y="0" width="112" height="56" rx="2" fill="none" stroke="#A33A2D" stroke-width="3"/>
      <text x="56" y="34" class="kai red" text-anchor="middle" font-size="20" font-weight="900" letter-spacing="3">持续更新</text>
    </g>
  </g>
</svg>
