<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">我的简报 · GitHub Profile 特刊</title>
  <desc id="desc">Sinton 的 GitHub Profile 头图：独立开发者、全栈开发者与个人博客入口。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="1300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8EEDC"/>
      <stop offset="0.52" stop-color="#F3E4C7"/>
      <stop offset="1" stop-color="#EAD6B1"/>
    </linearGradient>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 0H18M0 9H18" stroke="#6E5A43" stroke-opacity="0.07" stroke-width="1"/>
      <path d="M3 0V18M14 0V18" stroke="#6E5A43" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <pattern id="columns" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#8B7658" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3A2A1D" flood-opacity="0.1"/>
    </filter>
    <style>      @font-face { font-family: "Zhi Mang Xing"; font-style: normal; font-weight: 400; src: url("data:font/woff2;base64,") format("woff2"); unicode-range: U+6211,U+7684,U+7B80,U+62A5; }
      .headline { font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif; }
      .zhimang { font-family: "Zhi Mang Xing", "ZhiMangXing", "Zhi Mang Xing Regular", "Kaiti SC", "STKaiti", "KaiTi", cursive; }
      .kai { font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .ink { fill: #18120D; }
      .soft { fill: #5D4A36; }
      .red { fill: #A33A2D; }
      .micro { font-size: 14px; letter-spacing: 1.8px; font-weight: 700; }
      .body { font-size: 18px; font-weight: 700; }
    </style>
  </defs>

  <g filter="url(#shadow)">
    <rect x="34" y="30" width="1132" height="500" rx="12" fill="url(#paper)"/>
    <rect x="34" y="30" width="1132" height="500" rx="12" fill="url(#grain)"/>
    <rect x="34" y="30" width="1132" height="500" rx="12" fill="url(#columns)" opacity="0.6"/>
    <rect x="58" y="54" width="1084" height="462" rx="2" stroke="#18120D" stroke-width="3"/>
    <rect x="70" y="66" width="1060" height="438" rx="1" stroke="#18120D" stroke-width="1.2"/>

    <g class="mono micro soft">
      <text x="1110" y="99" text-anchor="end">Sinton · l0101.com</text>
    </g>
    <path d="M90 116H1110" stroke="#18120D" stroke-width="1.6"/>
    <path d="M90 123H1110" stroke="#18120D" stroke-width="0.8"/>

    <text x="600" y="218" class="zhimang ink" text-anchor="middle" font-size="86" font-weight="400" letter-spacing="1">我的简报</text>

    <path d="M90 252H1110" stroke="#18120D" stroke-width="5"/>
    <path d="M90 264H1110" stroke="#18120D" stroke-width="1.2"/>

    <g transform="translate(980 150) rotate(-8)">
      <rect x="0" y="0" width="135" height="56" rx="2" fill="none" stroke="#A33A2D" stroke-width="3"/>
      <text x="70" y="34" class="kai red" text-anchor="middle" font-size="22" font-weight="900" letter-spacing="0">Github 特刊</text>
    </g>

    <g>
      <rect x="90" y="292" width="250" height="192" fill="#F5E7CC" stroke="#18120D" stroke-width="1.4"/>
      <text x="114" y="328" class="mono micro red">开发者名片</text>
      <text x="114" y="374" class="headline ink" font-size="42" font-weight="900">Sinton</text>
      <text x="114" y="406" class="kai soft" font-size="22" font-weight="700">独立开发者</text>
      <text x="114" y="431" class="kai soft" font-size="22" font-weight="700">全栈开发者</text>
      <path d="M114 448H316" stroke="#A33A2D" stroke-width="1.4"/>
      <text x="114" y="472" class="mono soft" font-size="17" font-weight="800">iOS · Desktop · Web</text>
    </g>

    <g>
      <rect x="362" y="292" width="514" height="192" fill="#F9EED8" stroke="#18120D" stroke-width="1.4"/>
      <text x="388" y="329" class="mono micro red">我的头版</text>
      <text x="388" y="363" class="kai ink" font-size="24" font-weight="800">独立开发者的个人简报</text>
      <text x="388" y="397" class="kai soft" font-size="20" font-weight="700">写代码，做工具，也记录真实生活</text>
      <text x="388" y="428" class="kai soft" font-size="18" font-weight="700">更多内容欢迎到访我的个人博客 l0101.com</text>
    </g>

    <g>
      <rect x="902" y="292" width="208" height="192" fill="#F5E7CC" stroke="#18120D" stroke-width="1.4"/>
      <text x="926" y="328" class="mono micro red">博客专栏</text>
      <text x="926" y="369" class="headline ink" font-size="30" font-weight="900">l0101.com</text>
      <path d="M926 426H1086" stroke="#A33A2D" stroke-width="1.4"/>
      <text x="926" y="458" class="mono soft" font-size="14" font-weight="800">技术 / 产品 / 生活记录</text>
    </g>

    <path d="M90 516H1110" stroke="#18120D" stroke-width="1.4"/>
  </g>
</svg>

